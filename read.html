<!doctype html>
<html lang="en" data-world="town">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>the reading room · the town off the edge</title>
  <meta name="description" content="The reading room of the town off the edge.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238a6a34' stroke-width='3.2' stroke-linecap='round' stroke-dasharray='44 3 18 4'/%3E%3C/svg%3E"><!-- the lake: a coffee ring -->
  <!-- prefs before first paint: theme, text size, motion (see assets/js/prefs.js) -->
  <script>
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('stage.prefs.v1')) || {}; } catch (e) {}
      var r = document.documentElement;
      if (p.theme) r.setAttribute('data-theme', p.theme);
      if (p.size) r.setAttribute('data-size', p.size);
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      r.setAttribute('data-motion', p.motion ? p.motion : (reduce ? 'off' : 'on'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Share+Tech+Mono&display=swap">

  <link rel="stylesheet" href="assets/css/worlds/town.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/reader.css">
  <script type="module" src="assets/js/reader.js"></script>
</head>
<body class="reader">
  <a class="skip" href="#text">skip to the text</a>

  <!-- the red string runs the length of the rail: it fills as you read -->
  <div class="string" aria-hidden="true"><span class="string-fill"></span></div>

  <header class="rail">
    <a class="back" id="back" href="index.html"><kbd aria-hidden="true">⌫</kbd> backspace<span class="sr-only"> (back to the door)</span></a>

    <div class="rail-right">
      <details class="lamp pop" id="lamp">
        <summary>lamp<span class="sr-only"> (reading settings)</span></summary>
        <div class="lamp-panel pop-panel">
          <fieldset>
            <legend>text size</legend>
            <label><input type="radio" name="size" value="smaller"> smaller</label>
            <label><input type="radio" name="size" value="normal"> as set</label>
            <label><input type="radio" name="size" value="larger"> larger</label>
            <label><input type="radio" name="size" value="largest"> largest</label>
          </fieldset>
          <fieldset>
            <legend>light</legend>
            <label><input type="radio" name="theme" value="auto"> follow my device</label>
            <label><input type="radio" name="theme" value="paper"> paper</label>
            <label><input type="radio" name="theme" value="night"> night</label>
          </fieldset>
          <button class="toggle" type="button" id="motion-toggle">motion: on</button>
        </div>
      </details>
    </div>
  </header>

  <main id="text" tabindex="-1">
    <article class="chapter" id="chapter" aria-busy="true">
      <header class="chapter-head">
        <p class="hand" id="hand" hidden></p>
        <h1 class="chapter-title" id="title">&nbsp;</h1>
        <p class="chapter-sub" id="sub" hidden></p>
      </header>

      <div class="prose" id="prose"></div>

      <!-- last call is only the period. nobody likes it. -->
      <p class="last-call" id="last-call" hidden><span aria-hidden="true">.</span><span class="sr-only">the end of this piece</span></p>

      <div id="plate"></div>

      <footer class="colophon" id="colophon" hidden></footer>
    </article>

    <nav class="onward" id="onward" aria-label="more of the town" hidden></nav>

    <noscript>
      <p class="noscript">This reading room needs JavaScript to fetch its words. The words themselves are plain text files in <code>content/town/chapters/</code>.</p>
    </noscript>
  </main>
</body>
</html>
