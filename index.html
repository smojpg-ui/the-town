<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>the town off the edge</title>
  <meta name="description" content="A napkin map, a door a crack open, and a town that keeps growing out of letters.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238a6a34' stroke-width='3.2' stroke-linecap='round' stroke-dasharray='44 3 18 4'/%3E%3C/svg%3E"><!-- the lake: a coffee ring -->
  <meta name="robots" content="noindex"><!-- prototype: remove when Flor says it's ready to be found -->

  <!-- prefs before first paint: theme, text size, motion (see assets/js/prefs.js) -->
  <script>
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('stage.prefs.v1')) || {}; } catch (e) {}
      var r = document.documentElement;
      if (p.theme) r.setAttribute('data-theme', p.theme);
      if (p.size) r.setAttribute('data-size', p.size);
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      r.setAttribute('data-motion', p.motion ? p.motion : (reduce ? 'off' : 'on'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Share+Tech+Mono&display=swap">

  <link rel="stylesheet" href="assets/css/worlds/town.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/doorway.css">
  <script type="module" src="assets/js/doorway.js"></script>
</head>
<body class="doorway">

  <main class="napkin" id="napkin">

    <!-- the lake: up in the top corner, where the coffee left a ring. don't redraw it. -->
    <svg class="lake" viewBox="0 0 260 260" aria-hidden="true" focusable="false">
      <circle class="ring ring-outer" cx="130" cy="130" r="100"/>
      <circle class="ring ring-inner" cx="131" cy="128" r="93"/>
      <path class="ring ring-drip" d="M58 196 q-6 10 -2 16"/>
    </svg>

    <!-- soft country: a clock lies down in every blank corner -->
    <svg class="clock" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <circle cx="20" cy="20" r="15"/>
      <path d="M20 20 V11 M20 20 L26 23"/>
    </svg>

    <div class="room">
      <h1 class="title">the town off the edge</h1>

      <div class="hill">
        <!-- the doorway. one door, a crack open. -->
        <a class="door" href="map.html">
          <svg class="door-art" viewBox="0 0 140 200" aria-hidden="true" focusable="false">
            <path class="door-light" d="M30 186 V78 A40 40 0 0 1 110 78 V186 Z"/>
            <path class="door-spill" d="M101 186 L110 186 L124 199 L96 199 Z"/>
            <g class="door-panel">
              <path d="M30 186 V78 A40 40 0 0 1 110 78 V186 Z"/>
              <circle class="door-knob" cx="96" cy="138" r="3.2"/>
            </g>
            <path class="door-frame" d="M22 188 V76 A48 48 0 0 1 118 76 V188"/>
            <path class="door-sill" d="M10 189 Q70 185 132 190"/>
          </svg>
          <span class="door-label">things good go on the inside</span>
          <span class="sr-only">(go in, onto the napkin map)</span>
        </a>

        <!-- the creek runs the wrong way: uphill, slow. (after the door in the tab order; drawn west of it) -->
        <button class="creek" type="button" aria-label="the creek">
          <svg class="creek-line" viewBox="0 0 30 150" aria-hidden="true" focusable="false">
            <path d="M15 150 C 4 128, 26 112, 14 92 S 6 52, 17 34 S 24 10, 13 0"/>
          </svg>
          <span class="creek-bed" aria-hidden="true">
            <span class="do" style="--i:0">do,</span>
            <span class="do" style="--i:1">do,</span>
            <span class="do" style="--i:2">do</span>
          </span>
        </button>
      </div>

      <p class="hint mono">
        <span class="hint-keys"><kbd>tab</kbd> to run a tab · <kbd>enter</kbd> to go in</span>
        <span class="hint-touch">tap the door</span>
      </p>
    </div>

    <!-- the whole bottom edge is blank, and a road runs off it -->
    <div class="road-wrap">
      <svg class="road" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path d="M50 0 C 40 18, 62 30, 52 48 S 40 74, 54 86 S 50 96, 47 100"/>
      </svg>
      <p class="edge-q">what's off the edge?</p>
    </div>

    <p class="sr-only" id="creek-says" aria-live="polite"></p>
  </main>

  <!-- after the door in the tab order on purpose: the first tab lands on the door -->
  <aside class="desk-notes" aria-label="about this page">
    <span class="proto-tag">prototype · local only</span>
    <button class="toggle" type="button" id="motion-toggle">motion: on</button>
  </aside>

</body>
</html>
